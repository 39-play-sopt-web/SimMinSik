<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PLAY SOPT Web 1주차 HTML, CSS 자기소개 과제"
    />
    <title>심민식 | 자기소개</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 기본 1 / 심화 1: 헤더 -->
    <header class="site-header">
      <div class="header-profile" aria-label="프로필 영역">
        <img
          src="./images/profile-thumbnail.jpg"
          alt="심민식 프로필 사진"
        />
      </div>
      <h1>심민식 블로그</h1>

      <nav class="social-links" aria-label="소셜 링크">
        <a
          href="https://github.com/minsik1014"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub 프로필로 이동"
        >
          <img src="./images/github.svg" alt="" />
        </a>

        <a
          href="https://velog.io/@minsik1014/posts"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Velog 블로그로 이동"
        >
          <img src="./images/velog.svg" alt="" />
        </a>

        <a
          href="https://portfolio-by-minsik.vercel.app"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="심민식 포트폴리오로 이동"
        >
          <img src="./images/pokeball.svg" alt="" />
        </a>
      </nav>
    </header>

    <div class="page-layout">
      <!-- 기본 2 / 심화 2: 사이드 목차 -->
      <aside class="side-navigation">
        <nav aria-label="페이지 목차">
          <ul>
            <li><a href="#photo-dump">포토 덤프</a></li>
            <li><a href="#photo-album">사진첩</a></li>
            <li><a href="#interests">관심사</a></li>
            <li><a href="#to-webtory">To. 웹토리</a></li>
          </ul>
        </nav>
      </aside>

      <main>
        <!-- 기본 3 / 심화 3: 포토 덤프 -->
        <section id="photo-dump">
          <h2>포토 덤프</h2>

          <div class="photo-dump-grid">
            <figure class="photo-item photo-item-1">
              <img
                src="./images/photo1.jpg"
                alt="책사진"
              />
            </figure>
            <figure class="photo-item photo-item-2">
              <img
                src="./images/photo2.jpg"
                alt="한강독서사진"
              />
            </figure>
            <figure class="photo-item photo-item-3">
              <img
                src="./images/photo4.jpg"
                alt="등산사진"
              />
            </figure>
            <figure class="photo-item photo-item-4">
              <img
                src="./images/photo3.jpg"
                alt="데모데이사진"
              />
            </figure>
            <figure class="photo-item photo-item-5">
              <img
                src="./images/photo5.jpg"
                alt="강연금사진"
              />
            </figure>
            <figure class="photo-item photo-item-6">
              <img
                src="./images/photo6.jpg"
                alt="거울사진"
              />
            </figure>
          </div>
        </section>

        <!-- 기본 4 / 심화 4: 사진첩 -->
        <section id="photo-album">
          <h2>사진첩</h2>

          <!-- 기본 가로 스크롤과 심화 무한 루프를 한 사진첩 영역에 배치 -->
          <h3>가로 방향 스크롤</h3>
          <div class="album-scroll" aria-label="좋아하는 애니메이션 사진첩">
            <figure class="album-card">
              <img
                src="./images/album-zoro-1.webp"
                alt="롤로노아 조로 공식 캐릭터 이미지"
                loading="lazy"
              />
            </figure>

            <figure class="album-card">
              <img
                src="./images/album-zoro-2.jpg"
                alt="어린 조로와 쿠이나가 대련하는 애니메이션 장면"
                loading="lazy"
              />
            </figure>

            <figure class="album-card">
              <img
                src="./images/album-fullmetal-1.png"
                alt="강철의 연금술사 공식 애니메이션 이미지"
                loading="lazy"
              />
            </figure>

            <figure class="album-card">
              <img
                src="./images/album-fullmetal-2.png"
                alt="에드워드와 알폰스 엘릭 공식 캐릭터 이미지"
                loading="lazy"
              />
            </figure>

            <figure class="album-card">
              <img
                src="./images/album-luffy.webp"
                alt="몽키 D. 루피 공식 캐릭터 이미지"
                loading="lazy"
              />
            </figure>

            <figure class="album-card">
              <img
                src="./images/album-nami.webp"
                alt="나미 공식 캐릭터 이미지"
                loading="lazy"
              />
            </figure>

            <figure class="album-card">
              <img
                src="./images/album-naruto-1.webp"
                alt="나루토와 7반 공식 애니메이션 이미지"
                loading="lazy"
              />
            </figure>

            <figure class="album-card">
              <img
                src="./images/album-naruto-2.webp"
                alt="나루토 질풍전 공식 애니메이션 이미지"
                loading="lazy"
              />
            </figure>
          </div>

          <h3>무한 루프 배너</h3>
          <div class="album-marquee" aria-label="가로로 자동 반복되는 애니메이션 사진첩">
            <div class="album-marquee-track">
              <div class="album-marquee-group">
                <img src="./images/album-zoro-1.webp" alt="롤로노아 조로" />
                <img src="./images/album-zoro-2.jpg" alt="조로와 쿠이나" />
                <img src="./images/album-fullmetal-1.png" alt="강철의 연금술사" />
                <img src="./images/album-fullmetal-2.png" alt="엘릭 형제" />
                <img src="./images/album-luffy.webp" alt="몽키 D. 루피" />
                <img src="./images/album-nami.webp" alt="나미" />
                <img src="./images/album-naruto-1.webp" alt="나루토 7반" />
                <img src="./images/album-naruto-2.webp" alt="나루토 질풍전" />
              </div>

              <!-- 같은 묶음을 이어 붙여 빈 공간 없이 반복 -->
              <div class="album-marquee-group" aria-hidden="true">
                <img src="./images/album-zoro-1.webp" alt="" />
                <img src="./images/album-zoro-2.jpg" alt="" />
                <img src="./images/album-fullmetal-1.png" alt="" />
                <img src="./images/album-fullmetal-2.png" alt="" />
                <img src="./images/album-luffy.webp" alt="" />
                <img src="./images/album-nami.webp" alt="" />
                <img src="./images/album-naruto-1.webp" alt="" />
                <img src="./images/album-naruto-2.webp" alt="" />
              </div>
            </div>
          </div>
        </section>

        <section id="interests">
          <h2>관심사</h2>
        </section>

        <section id="to-webtory">
          <h2>To. 웹토리</h2>
        </section>
      </main>
    </div>

    <footer>
      <p>&copy; 2026 Sim Min Sik</p>
    </footer>
  </body>
</html>
