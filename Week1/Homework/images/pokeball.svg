<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="pokeball-title"
>
  <title id="pokeball-title">몬스터볼</title>
  <defs>
    <clipPath id="pokeball-clip">
      <circle cx="32" cy="32" r="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#pokeball-clip)">
    <rect width="64" height="32" fill="#ef233c" />
    <rect y="32" width="64" height="32" fill="#ffffff" />
    <rect y="28" width="64" height="8" fill="#202124" />
  </g>

  <circle cx="32" cy="32" r="28" fill="none" stroke="#202124" stroke-width="4" />
  <circle cx="32" cy="32" r="10" fill="#ffffff" stroke="#202124" stroke-width="4" />
  <circle cx="32" cy="32" r="4" fill="#d9dde3" />
</svg>
